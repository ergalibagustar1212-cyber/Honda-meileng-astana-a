<body>
    <script>
        let proomise = new Promise((resolve, reject) => {
            setTimeout(()=>{
                let succes = true;
                if(succes){resolve("успешно");
            }
                else{
                    reject("отклонено");
                }
                },1000)
        })

        proomise .then((message)=>{
            console.log(message);
        })
        .catch((error)=>{
console.log(error);

        })
    </script>
</body>
